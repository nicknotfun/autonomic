[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomic-sdk"
version = "0.1.0"
description = "Python SDK for Autonomic Mirage Media Server, MAS/MRAD, and MA6 control APIs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Autonomic SDK contributors"}]
keywords = ["autonomic", "mirage", "ma6", "mrad", "mms", "media-server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["autonomic", "autonomic.*", "autonomic_ma6", "autonomic_ma6.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
