# Build metadata and test configuration for the Autonomic Python SDK.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomic-sdk"
version = "0.1.0"
description = "Python SDK for Autonomic direct amplifier control APIs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Autonomic SDK contributors"}]
keywords = ["autonomic", "mirage", "amplifier", "direct-amp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = ["click>=8.0", "pydantic>=2.0", "sortedcontainers>=2.4"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.0"]

[tool.mypy]
strict = true
files = ["amp"]

[tool.setuptools.packages.find]
include = ["amp", "amp.*"]

[tool.pytest.ini_options]
testpaths = ["amp/tests"]
pythonpath = ["."]
